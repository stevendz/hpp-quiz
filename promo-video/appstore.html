<div id="stage"><div id="cam">
  <div id="bg" class="layer">
    <div class="base"></div>
    <div class="blob" id="blobA"></div>
    <div class="blob" id="blobB"></div>
    <div class="blob" id="blobD"></div>
    <div id="shapes"></div>
  </div>

  <!-- the app, full screen, as a screen capture would show it -->

  <!-- chapter copy over the frosted capture -->

  <div id="over" class="layer"><div class="blob" id="blobC"></div><div id="rays"></div></div>

    <div id="wallWrap"><div id="wall"></div></div>
    <div id="scrim"></div>
    <div id="phrase">Welche Aussage<br>trifft zu<span class="q">?</span></div>

      <div class="digits" id="digits"></div>
      <div class="cl" id="cl">Prüfungsfragen</div>
      <div class="cs" id="cs">aus 20 vergangenen Prüfungen</div>
    </div>
  </div>
